  <meta charset="utf-8" />

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/contact.css" />
</head>
<body>
<header>
  <div class="container nav">
    <div class="logo"><a href="index.html">StudentPortfolio<span style="color:var(--accent)">.kit</span></a></div>
    <nav>
      <ul>
          <li><a href="index.html" class="">Home</a></li>
          <li><a href="about.html" class="">About</a></li>
          <li><a href="portfolio.html" class="">Portfolio</a></li>

    </nav>
    <button class="theme-toggle" aria-label="Toggle theme">🌓</button>
  </div>
  <div class="mobile-menu" id="mobile-menu"></div>
</header>
<main>
  <div class="container">

<section>
  <h1>Contact</h1>
  <form id="contact-form" class="card">
    <div class="grid cols-2">
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" placeholder="Your name" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@school.edu" required />
      </div>
    </div>
    <div>
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell me about your project…"></textarea>
    </div>
    <button class="btn primary" type="submit">Send</button>
    <div class="success" id="success">Thanks! I'll get back to you soon.</div>
    <div class="error" id="error">Please fill in all fields.</div>
  </form>
</section>

  </div>
</main>
<footer>
  <div class="container">
    <div>© <span id="year"></span> Student Portfolio Starter. Built with HTML • CSS • JS • jQuery.</div>
  </div>
</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
